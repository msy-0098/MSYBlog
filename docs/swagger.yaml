host: localhost:8080
info:
  contact:
    name: 马森雨
    url: https://masenyu.top
  description: 马森雨个人技术博客（masenyu.top）RESTful API 接口文档，涵盖文章、分类、标签、项目、友链、评论、AI助手、数据看板与站点管理等模块。
  title: 马森雨个人技术博客 API
  version: "1.0"
paths:
  /admin/2fa/disable:
    post:
      consumes:
      - application/json
      description: 校验当前密码及动态码，关闭管理员 2FA 功能
      parameters:
      - description: 密码与动态码
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.Disable2FARequest'
      produces:
      - application/json
      responses:
        "200":
          description: 关闭成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: 密码或验证码错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      - CsrfToken: []
      summary: 关闭两步验证
      tags:
      - 管理员认证与安全
  /admin/2fa/enable:
    post:
      consumes:
      - application/json
      description: 输入 TOTP 验证码确认绑定，正式激活 2FA
      parameters:
      - description: TOTP 验证码
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.Enable2FARequest'
      produces:
      - application/json
      responses:
        "200":
          description: 启用成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: 验证码错误或未生成密钥
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      - CsrfToken: []
      summary: 校验并启用两步验证
      tags:
      - 管理员认证与安全
  /admin/2fa/setup:
    post:
      description: 为当前管理员生成未激活的 TOTP 密钥和二维码配置 URL
      produces:
      - application/json
      responses:
        "200":
          description: 生成成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.Setup2FAResponse'
              type: object
        "400":
          description: 两步验证已启用
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      - CsrfToken: []
      summary: 生成 2FA 密钥与配置二维码
      tags:
      - 管理员认证与安全
  /admin/ai/beautify:
    post:
      consumes:
      - application/json
      description: 调用大模型自动优化文章标题、摘要和 Markdown 正文排版
      parameters:
      - description: 文章润色请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.BeautifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 润色结果
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.BeautifyResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "502":
          description: 润色处理失败
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      - CsrfToken: []
      summary: 文章 AI 润色美化
      tags:
      - AI 助手与智能工具
  /admin/ai/chat:
    post:
      consumes:
      - application/json
      description: 携带历史消息列表向后台配置的 AI 大模型发起单次问答
      parameters:
      - description: 对话消息列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.AIChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: AI 回复
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.AIChatResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "502":
          description: 模型调用失败
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      - CsrfToken: []
      summary: AI 单次对话
      tags:
      - AI 助手与智能工具
  /admin/ai/conversations:
    delete:
      description: 批量删除当前管理员名下的全部对话记录
      produces:
      - application/json
      responses:
        "200":
          description: 清空成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  type: object
              type: object
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      - CsrfToken: []
      summary: 清空全部 AI 对话会话
      tags:
      - AI 助手与智能工具
    get:
      description: 查询当前管理员创建的全部 AI 对话会话
      produces:
      - application/json
      responses:
        "200":
          description: 会话列表
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/handler.AIConversationDTO'
                  type: array
              type: object
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      - CsrfToken: []
      summary: 获取 AI 对话会话列表
      tags:
      - AI 助手与智能工具
    post:
      description: 创建一个空对话会话，随后可调用流式对话接口交流
      produces:
      - application/json
      responses:
        "200":
          description: 新建会话
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.AIConversationDTO'
              type: object
        "401":
          description: 未登录
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      - CsrfToken: []
      summary: 新建 AI 对话会话
      tags:
      - AI 助手与智能工具
  /admin/ai/conversations/{id}:
    delete:
      description: 根据会话 ID 删除对话及其所有消息
      parameters:
      - description: 会话 ID
        in: path
