            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.ListDTO-handler_ArchiveYear'
              type: object
        "500":
          description: 服务端错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 获取文章归档列表
      tags:
      - 博客公开接口
  /auth/email-code:
    post:
      consumes:
      - application/json
      description: 发送用于注册（register）或重置密码（reset）的邮箱数字验证码
      parameters:
      - description: 邮箱与用途
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.EmailCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 发送成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "429":
          description: 请求过于频繁
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 发送邮箱验证码
      tags:
      - 访客认证
  /auth/login:
    post:
      consumes:
      - application/json
      description: 访客邮箱密码登录，登录成功后写入认证 Cookie
      parameters:
      - description: 登录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.VisitorLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.VisitorAuthResponse'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: 邮箱或密码错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "429":
          description: 多次登录失败账号暂时锁定
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 访客登录
      tags:
      - 访客认证
  /auth/logout:
    post:
      description: 清除访客认证状态与 Cookie
      produces:
      - application/json
      responses:
        "200":
          description: 退出登录成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  type: object
              type: object
      summary: 访客退出登录
      tags:
      - 访客认证
  /auth/register:
    post:
      consumes:
      - application/json
      description: 访客凭邮箱验证码注册账号并自动登录
      parameters:
      - description: 注册信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.VisitorRegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 注册成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.VisitorAuthResponse'
              type: object
        "400":
          description: 验证码错误或参数不合法
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: 邮箱已存在
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 服务端错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 访客注册
      tags:
      - 访客认证
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: 访客通过邮箱验证码重置登录密码
      parameters:
      - description: 重置密码请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.VisitorResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 重置成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  type: object
              type: object
        "400":
          description: 验证码错误或过期
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 重置访客密码
      tags:
      - 访客认证
  /categories:
    get:
      description: 获取包含公开文章的分类列表及其文章数量
      produces:
      - application/json
      responses:
        "200":
          description: 分类列表
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.ListDTO-handler_TaxonomyDTO'
              type: object
        "500":
          description: 服务端错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 获取公开分类列表
      tags:
      - 博客公开接口
  /categories/{slug}/posts:
    get:
      description: 分页获取属于某个分类的已发布文章
      parameters:
      - description: 分类 slug
        in: path
        name: slug
        required: true
        type: string
      - default: 1
        description: 当前页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页条数
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 文章列表
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.PageDTO-handler_PostSummary'
              type: object
        "500":
          description: 服务端错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 获取指定分类的文章列表
      tags:
      - 博客公开接口
  /links:
    get:
      description: 获取公开可见的友情链接列表
      produces:
      - application/json
      responses:
        "200":
          description: 友链列表
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.ListDTO-handler_FriendLinkDTO'
              type: object
        "500":
          description: 服务端错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 获取友情链接列表
      tags:
      - 博客公开接口
  /posts:
    get:
      description: 分页查询已发布文章，支持分类、标签和搜索词过滤
      parameters:
      - default: 1
        description: 当前页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页条数
        in: query
        name: pageSize
        type: integer
      - description: 文章标识 slug
        in: query
        name: slug
        type: string
      - description: 分类标识 slug
        in: query
        name: category
        type: string
      - description: 标签标识 slug
        in: query
        name: tag
        type: string
      - description: 搜索关键词
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 文章列表
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.PageDTO-handler_PostSummary'
              type: object
        "500":
          description: 服务端错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 获取公开文章列表
      tags:
      - 博客公开接口
  /posts/{slug}:
    get:
      description: 根据文章 slug 获取单篇文章完整内容及上下文跳转
      parameters:
      - description: 文章 slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 文章详情
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.PostDetail'
              type: object
        "404":
          description: 文章不存在
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 服务端错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 获取文章详情
      tags:
      - 博客公开接口
  /posts/{slug}/comments:
    get:
      description: 获取指定文章已审核通过的评论列表
      parameters:
      - description: 文章 slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 评论列表
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.PageDTO-handler_CommentDTO'
              type: object
        "404":
          description: 文章不存在
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 服务端错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 获取文章评论列表
      tags:
      - 评论互动
    post:
      consumes:
      - application/json
      description: 登录的访客用户对指定文章发表评论（提交后需管理员审核）
      parameters:
      - description: 文章 slug
        in: path
        name: slug
        required: true
        type: string
      - description: 评论内容
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 评论提交成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.CommentDTO'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: 未授权登录
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: 文章不存在
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 服务端错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 发表文章评论
      tags:
      - 评论互动
  /posts/{slug}/like:
    post:
      description: 根据客户端 IP 对公开文章进行点赞（重复点赞返回当前点赞状态）
      parameters:
      - description: 文章 slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 点赞结果
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  type: object
              type: object
        "404":
          description: 文章不存在
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: 服务端错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 文章点赞
      tags:
      - 博客公开接口
  /projects:
    get:
      description: 获取公开可见的个人技术项目列表
      produces:
      - application/json
      responses:
        "200":
          description: 项目列表
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.ListDTO-handler_ProjectDTO'
              type: object
        "500":
          description: 服务端错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 获取精选项目列表
      tags:
      - 博客公开接口
  /robots.txt:
    get:
      description: 返回站点的 robots.txt 文本
      produces:
      - text/plain
      responses:
        "200":
          description: Robots.txt 文本
          schema:
            type: string
        "500":
          description: 服务端错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 生成 robots.txt 爬虫协议
      tags:
      - 站点与公开信息
  /rss.xml:
    get:
      description: 返回符合 RSS 2.0 规范的 XML 文章列表
      produces:
      - text/xml
      responses:
        "200":
          description: RSS XML
          schema:
            type: string
        "500":
          description: 服务端错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 生成 RSS 订阅源
      tags:
      - 站点与公开信息
  /search:
    get:
      description: 根据关键词模糊搜索文章标题、摘要和内容
      parameters:
      - description: 搜索关键词
        in: query
        name: q
        type: string
      - default: 1
        description: 当前页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页条数
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 搜索结果
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.PageDTO-handler_PostSummary'
              type: object
        "500":
          description: 服务端错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 站内文章搜索
      tags:
      - 博客公开接口
  /site:
    get:
      description: 获取博客站点的基础公开信息，包括站点标题、副标题、站长名、域名、描述及导航项
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.SiteProfile'
              type: object
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 获取站点公开配置
      tags:
      - 站点与公开信息
  /sitemap.xml:
    get:
      description: 返回符合 sitemap 规范的 XML 链接索引
      produces:
      - text/xml
      responses:
        "200":
          description: Sitemap XML
          schema:
            type: string
        "500":
          description: 服务端错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 生成站点地图
      tags:
      - 站点与公开信息
  /tags:
    get:
      description: 获取包含公开文章的标签列表及其文章数量
      produces:
      - application/json
      responses:
        "200":
          description: 标签列表
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.ListDTO-handler_TaxonomyDTO'
              type: object
        "500":
          description: 服务端错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 获取公开标签列表
      tags:
      - 博客公开接口
  /tags/{slug}/posts:
    get:
      description: 分页获取具有某个标签的已发布文章
      parameters:
      - description: 标签 slug
        in: path
        name: slug
        required: true
        type: string
      - default: 1
        description: 当前页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页条数
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 文章列表
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handler.PageDTO-handler_PostSummary'
              type: object
        "500":
          description: 服务端错误
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 获取指定标签的文章列表
      tags:
      - 博客公开接口
securityDefinitions:
  BearerAuth:
    description: '请输入 JWT Token，格式为: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
  CsrfToken:
    description: 管理端防跨站请求伪造令牌
    in: header
    name: X-CSRF-Token
    type: apiKey
swagger: "2.0"
